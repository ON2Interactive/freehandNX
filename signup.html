<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="FreehandNX" />
    <meta name="description" content="Design posters, photobooks, and magazines with complete layout control. FreehandNX is a modern design tool inspired by the spirit of Freehand." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FreehandNX" />
    <meta property="og:title" content="FreehandNX – Modern Layout Design Tool for Posters & Magazines" />
    <meta property="og:description" content="Design posters, photobooks, and magazines with complete layout control. FreehandNX is a modern design tool inspired by the spirit of Freehand." />
    <meta property="og:image" content="https://freehandnx.com/assets/Share.png" />
    <meta property="og:image:alt" content="FreehandNX share preview" />
    <meta property="og:url" content="https://freehandnx.com/signup" />
    <link rel="canonical" href="https://freehandnx.com/signup" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FreehandNX – Modern Layout Design Tool for Posters & Magazines" />
    <meta name="twitter:description" content="Design posters, photobooks, and magazines with complete layout control. FreehandNX is a modern design tool inspired by the spirit of Freehand." />
    <meta name="twitter:image" content="https://freehandnx.com/assets/Share.png" />
    <title>Sign Up - FreehandNX</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        background: #050505;
        color: #f2f2f2;
      }

      .signup-shell {
        width: 100vw;
        height: 100vh;
        display: grid;
        grid-template-columns: 1fr 1fr;
        overflow: hidden;
      }

      .signup-media {
        background: #0e0e0e url("/assets/hero-background.png") center center / cover no-repeat;
      }

      .signup-panel {
        position: relative;
        background: #090909;
        display: grid;
        align-content: center;
        justify-items: start;
        gap: 18px;
        padding: 56px 64px 44px;
      }

      .signup-logo {
        display: block;
        width: 280px;
        max-width: 100%;
        height: auto;
        margin-bottom: 20px;
      }

      .signup-link {
        display: inline-flex;
        align-items: center;
        justify-content: flex-start;
        color: rgba(255, 255, 255, 0.88);
        text-decoration: none;
        font-size: 18px;
        line-height: 1.2;
        font-weight: 500;
      }

      .signup-link:hover {
        color: #fff;
        text-decoration: underline;
        text-underline-offset: 5px;
      }

      @media (max-width: 960px) {
        .signup-shell {
          grid-template-columns: 1fr;
        }

        .signup-media {
          min-height: 280px;
        }

        .signup-panel {
          padding: 28px 24px 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="signup-shell" aria-label="Sign up">
      <section class="signup-media" aria-hidden="true"></section>
      <section class="signup-panel">
        <img src="/Logo/FreehandNX-White.svg" alt="FreehandNX" class="signup-logo" />
        <a class="signup-link" id="signupGoogleLink" href="/api/auth/google/start">SignUp with Google</a>
      </section>
    </main>
    <script>
      (function setSignupRedirectTarget() {
        const link = document.getElementById("signupGoogleLink");
        if (!link) return;
        const redirectTo = `${window.location.origin}/auth-callback`;
        link.href = `/api/auth/google/start?redirect_to=${encodeURIComponent(redirectTo)}`;
      })();
    </script>
  </body>
</html>

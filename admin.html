<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="FreehandNX" />
    <meta
      name="description"
      content="Design posters, photobooks, and magazines with complete layout control. FreehandNX is a modern design tool inspired by the spirit of Freehand."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FreehandNX" />
    <meta property="og:title" content="FreehandNX – Modern Layout Design Tool for Posters & Magazines" />
    <meta
      property="og:description"
      content="Design posters, photobooks, and magazines with complete layout control. FreehandNX is a modern design tool inspired by the spirit of Freehand."
    />
    <meta property="og:image" content="https://freehandnx.com/assets/Share.png" />
    <meta property="og:image:alt" content="FreehandNX share preview" />
    <meta property="og:url" content="https://freehandnx.com/admin" />
    <link rel="canonical" href="https://freehandnx.com/admin" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FreehandNX – Modern Layout Design Tool for Posters & Magazines" />
    <meta
      name="twitter:description"
      content="Design posters, photobooks, and magazines with complete layout control. FreehandNX is a modern design tool inspired by the spirit of Freehand."
    />
    <meta name="twitter:image" content="https://freehandnx.com/assets/Share.png" />
    <title>Admin - FreehandNX</title>
    <link rel="icon" type="image/svg+xml" href="/assets/darkroomx-favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="common-page admin-page">
    <main class="common-shell">
      <header class="landing-nav">
        <a class="landing-brand" href="/" aria-label="FreehandNX Home">
          <img src="/Logo/FreehandNX-White.svg" alt="FreehandNX" class="landing-brand-logo" />
        </a>
        <nav class="landing-nav-links" aria-label="Primary">
          <a href="/editor">Editor</a>
          <button id="adminLogoutBtn" class="contact-submit-btn admin-logout-btn" type="button">Log Out</button>
        </nav>
      </header>

      <section class="common-blank-section" aria-label="Admin page content">
        <div class="common-page-inner">
          <div class="admin-topbar">
            <h1>Admin</h1>
          </div>
          <div class="admin-placeholder">
            <div class="admin-table-head">
              <h2>Users</h2>
              <div class="admin-table-controls">
                <input id="adminSearchInput" class="admin-table-search" type="search" placeholder="Search email or username" />
                <select id="adminSortSelect" class="admin-table-sort" aria-label="Sort users">
                  <option value="created-desc">Newest</option>
                  <option value="created-asc">Oldest</option>
                  <option value="credits-desc">Credits (High to Low)</option>
                  <option value="credits-asc">Credits (Low to High)</option>
                  <option value="email-asc">Email (A-Z)</option>
                  <option value="email-desc">Email (Z-A)</option>
                </select>
                <button id="adminRefreshBtn" class="contact-submit-btn admin-refresh-btn" type="button">Refresh</button>
              </div>
            </div>
            <p id="adminUsersStatus" class="admin-users-status" aria-live="polite"></p>
            <div class="admin-table-wrap">
              <table class="admin-users-table">
                <thead>
                  <tr>
                    <th>Email</th>
                    <th>Username</th>
                    <th>Credits</th>
                    <th>Created</th>
                    <th>Last Sign In</th>
                    <th class="admin-col-actions">Actions</th>
                  </tr>
                </thead>
                <tbody id="adminUsersTbody">
                  <tr>
                    <td colspan="6" class="admin-empty-cell">Loading users...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="adminEmailModal" class="admin-email-modal" hidden>
      <div id="adminEmailModalBackdrop" class="admin-email-modal-backdrop"></div>
      <section class="admin-email-dialog" role="dialog" aria-modal="true" aria-labelledby="adminEmailDialogTitle">
        <header class="admin-email-dialog-head">
          <h2 id="adminEmailDialogTitle">Send Email</h2>
          <button id="adminEmailCloseBtn" type="button" class="admin-email-close-btn" aria-label="Close">✕</button>
        </header>
        <div class="admin-email-dialog-body">
          <form id="adminEmailForm" class="admin-email-form">
            <label for="adminEmailTo">To</label>
            <input id="adminEmailTo" type="email" readonly />
            <label for="adminEmailSubject">Subject</label>
            <input id="adminEmailSubject" type="text" maxlength="180" required />
            <label for="adminEmailMessage">Message</label>
            <textarea id="adminEmailMessage" rows="10" maxlength="8000" required></textarea>
            <p id="adminEmailStatus" class="admin-email-status" aria-live="polite"></p>
            <button id="adminEmailSendBtn" type="submit" class="contact-submit-btn admin-email-send-btn">Send Email</button>
          </form>
        </div>
      </section>
    </div>

    <script>
      (() => {
        const statusEl = document.getElementById("adminUsersStatus");
        const tbody = document.getElementById("adminUsersTbody");
        const refreshBtn = document.getElementById("adminRefreshBtn");
        const logoutBtn = document.getElementById("adminLogoutBtn");
        const searchInput = document.getElementById("adminSearchInput");
        const sortSelect = document.getElementById("adminSortSelect");
        const nav = document.querySelector(".landing-nav");

        const emailModal = document.getElementById("adminEmailModal");
        const emailBackdrop = document.getElementById("adminEmailModalBackdrop");
        const emailCloseBtn = document.getElementById("adminEmailCloseBtn");
        const emailForm = document.getElementById("adminEmailForm");
        const emailToInput = document.getElementById("adminEmailTo");
        const emailSubjectInput = document.getElementById("adminEmailSubject");
        const emailMessageInput = document.getElementById("adminEmailMessage");
        const emailStatusEl = document.getElementById("adminEmailStatus");
        const emailSendBtn = document.getElementById("adminEmailSendBtn");

        if (
          !statusEl ||
          !tbody ||
          !refreshBtn ||
          !logoutBtn ||
          !searchInput ||
          !sortSelect ||
          !nav ||
          !emailModal ||
          !emailBackdrop ||
          !emailCloseBtn ||
          !emailForm ||
          !emailToInput ||
          !emailSubjectInput ||
          !emailMessageInput ||
          !emailStatusEl ||
          !emailSendBtn
        ) {
          return;
        }

        let allUsers = [];
        let activeEmailUserId = "";
        let activeEmailUserName = "";

        let lastScrollY = window.scrollY || 0;
        const delta = 8;
        const topRevealThreshold = 80;
        const onScroll = () => {
          const currentY = window.scrollY || 0;
          const diff = currentY - lastScrollY;
          if (currentY <= topRevealThreshold) {
            nav.classList.remove("is-hidden");
            lastScrollY = currentY;
            return;
          }
          if (Math.abs(diff) < delta) return;
          if (diff > 0) nav.classList.add("is-hidden");
          else nav.classList.remove("is-hidden");
          lastScrollY = currentY;
        };
        window.addEventListener("scroll", onScroll, { passive: true });

        const formatDate = (value) => {
          const text = String(value || "").trim();
          if (!text) return "-";
          const d = new Date(text);
          if (Number.isNaN(d.getTime())) return "-";
          return d.toLocaleString();
        };

        const escapeHtml = (value) =>
          String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\"/g, "&quot;")
            .replace(/'/g, "&#39;");

        const setStatus = (text) => {
          statusEl.textContent = String(text || "");
        };

        const setEmailStatus = (text) => {
          emailStatusEl.textContent = String(text || "");
        };

        const ensureAuth = async () => {
          const response = await fetch("/api/admin/session", { method: "GET" });
          if (!response.ok) {
            window.location.replace("/adminlogin");
            return false;
          }
          return true;
        };

        const getFilteredAndSortedUsers = () => {
          const query = String(searchInput.value || "").trim().toLowerCase();
          const sortMode = String(sortSelect.value || "created-desc").trim();
          let users = allUsers.slice();

          if (query) {
            users = users.filter((user) => {
              const email = String(user.email || "").toLowerCase();
              const username = String(user.username || "").toLowerCase();
              return email.includes(query) || username.includes(query);
            });
          }

          const sorters = {
            "created-desc": (a, b) => new Date(b.createdAt || 0).getTime() - new Date(a.createdAt || 0).getTime(),
            "created-asc": (a, b) => new Date(a.createdAt || 0).getTime() - new Date(b.createdAt || 0).getTime(),
            "credits-desc": (a, b) => Number(b.creditsBalance || 0) - Number(a.creditsBalance || 0),
            "credits-asc": (a, b) => Number(a.creditsBalance || 0) - Number(b.creditsBalance || 0),
            "email-asc": (a, b) => String(a.email || "").localeCompare(String(b.email || "")),
            "email-desc": (a, b) => String(b.email || "").localeCompare(String(a.email || "")),
          };
          const sorter = sorters[sortMode] || sorters["created-desc"];
          users.sort(sorter);
          return users;
        };

        const renderRows = () => {
          const users = getFilteredAndSortedUsers();
          if (!Array.isArray(users) || !users.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="admin-empty-cell">No users found.</td></tr>';
            return;
          }
          tbody.innerHTML = users
            .map((user) => {
              const userId = escapeHtml(user.id);
              const userEmail = escapeHtml(user.email);
              const userName = escapeHtml(user.username);
              return `
                <tr data-user-id="${userId}" data-user-email="${userEmail}" data-user-name="${userName}">
                  <td class="admin-cell-email">${userEmail}</td>
                  <td><input class="admin-cell-input admin-input-username" type="text" value="${userName}" /></td>
                  <td><input class="admin-cell-input admin-cell-input-number admin-input-credits" type="number" min="0" step="1" value="${Number(user.creditsBalance || 0)}" /></td>
                  <td>${escapeHtml(formatDate(user.createdAt))}</td>
                  <td>${escapeHtml(formatDate(user.lastSignInAt))}</td>
                  <td class="admin-actions-cell">
                    <button class="admin-row-email-btn" type="button" title="Email user" aria-label="Email user">✉</button>
                    <button class="admin-row-save-btn" type="button">Save</button>
                    <button class="admin-row-delete-btn" type="button" title="Delete user">🗑</button>
                  </td>
                </tr>
              `;
            })
            .join("");
        };

        const closeEmailModal = () => {
          emailModal.hidden = true;
          activeEmailUserId = "";
          activeEmailUserName = "";
          emailForm.reset();
          emailToInput.value = "";
          setEmailStatus("");
        };

        const openEmailModal = (row) => {
          const userId = String(row?.dataset?.userId || "").trim();
          const userEmail = String(row?.dataset?.userEmail || "").trim();
          const userName = String(row?.dataset?.userName || "").trim();
          if (!userId || !userEmail) return;
          activeEmailUserId = userId;
          activeEmailUserName = userName;
          emailToInput.value = userEmail;
          emailSubjectInput.value = "FreehandNX update";
          emailMessageInput.value = userName ? `Hi ${userName},\n\n` : "";
          setEmailStatus("");
          emailModal.hidden = false;
          emailSubjectInput.focus();
        };

        const loadUsers = async () => {
          refreshBtn.disabled = true;
          setStatus("Loading users...");
          try {
            const response = await fetch("/api/admin/users", { method: "GET" });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
              setStatus(payload?.error || "Unable to load users.");
              if (response.status === 401) window.location.replace("/adminlogin");
              return;
            }
            allUsers = Array.isArray(payload?.users) ? payload.users : [];
            renderRows();
            setStatus(`Loaded ${allUsers.length} user(s).`);
          } catch {
            setStatus("Network error while loading users.");
          } finally {
            refreshBtn.disabled = false;
          }
        };

        const onTableClick = async (event) => {
          const row = event.target.closest("tr[data-user-id]");
          if (!row) return;
          const userId = row.getAttribute("data-user-id");
          if (!userId) return;

          if (event.target.closest(".admin-row-email-btn")) {
            openEmailModal(row);
            return;
          }

          if (event.target.closest(".admin-row-save-btn")) {
            const username = String(row.querySelector(".admin-input-username")?.value || "").trim();
            const creditsRaw = String(row.querySelector(".admin-input-credits")?.value || "0").trim();
            const creditsBalance = Number(creditsRaw);
            setStatus("Saving user...");
            try {
              const response = await fetch(`/api/admin/users/${encodeURIComponent(userId)}`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, creditsBalance }),
              });
              const payload = await response.json().catch(() => ({}));
              if (!response.ok) {
                setStatus(payload?.error || "Unable to save user.");
                if (response.status === 401) window.location.replace("/adminlogin");
                return;
              }
              const updatedUser = payload?.user;
              if (updatedUser && updatedUser.id) {
                allUsers = allUsers.map((entry) => (String(entry.id) === String(updatedUser.id) ? updatedUser : entry));
              }
              renderRows();
              setStatus("User saved.");
            } catch {
              setStatus("Network error while saving user.");
            }
            return;
          }

          if (event.target.closest(".admin-row-delete-btn")) {
            const email = String(row.querySelector(".admin-cell-email")?.textContent || "").trim();
            if (!window.confirm(`Delete user ${email}? This action cannot be undone.`)) return;
            setStatus("Deleting user...");
            try {
              const response = await fetch(`/api/admin/users/${encodeURIComponent(userId)}`, {
                method: "DELETE",
              });
              const payload = await response.json().catch(() => ({}));
              if (!response.ok) {
                setStatus(payload?.error || "Unable to delete user.");
                if (response.status === 401) window.location.replace("/adminlogin");
                return;
              }
              allUsers = allUsers.filter((entry) => String(entry.id) !== String(userId));
              renderRows();
              setStatus("User deleted.");
            } catch {
              setStatus("Network error while deleting user.");
            }
          }
        };

        tbody.addEventListener("click", onTableClick);

        searchInput.addEventListener("input", () => {
          renderRows();
        });

        sortSelect.addEventListener("change", () => {
          renderRows();
        });

        emailForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          const toEmail = String(emailToInput.value || "").trim();
          const subject = String(emailSubjectInput.value || "").trim();
          const message = String(emailMessageInput.value || "").trim();
          if (!activeEmailUserId || !toEmail) {
            setEmailStatus("Missing user email.");
            return;
          }
          if (!subject || !message) {
            setEmailStatus("Subject and message are required.");
            return;
          }
          emailSendBtn.disabled = true;
          setEmailStatus("Sending email...");
          try {
            const response = await fetch("/api/admin/email", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                userId: activeEmailUserId,
                email: toEmail,
                name: activeEmailUserName,
                subject,
                message,
              }),
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
              setEmailStatus(payload?.error || "Unable to send email.");
              if (response.status === 401) window.location.replace("/adminlogin");
              return;
            }
            setEmailStatus("Email sent.");
            window.setTimeout(closeEmailModal, 700);
          } catch {
            setEmailStatus("Network error while sending email.");
          } finally {
            emailSendBtn.disabled = false;
          }
        });

        emailCloseBtn.addEventListener("click", closeEmailModal);
        emailBackdrop.addEventListener("click", closeEmailModal);
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !emailModal.hidden) {
            closeEmailModal();
          }
        });

        refreshBtn.addEventListener("click", () => {
          loadUsers();
        });

        logoutBtn.addEventListener("click", async () => {
          logoutBtn.disabled = true;
          try {
            await fetch("/api/admin/logout", { method: "POST" });
          } catch {}
          window.location.replace("/adminlogin");
        });

        ensureAuth().then((ok) => {
          if (ok) loadUsers();
        });
      })();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="FreehandNX" />
    <meta
      name="description"
      content="Design posters, photobooks, and magazines with complete layout control. FreehandNX is a modern design tool inspired by the spirit of Freehand."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FreehandNX" />
    <meta property="og:title" content="FreehandNX – Modern Layout Design Tool for Posters & Magazines" />
    <meta
      property="og:description"
      content="Design posters, photobooks, and magazines with complete layout control. FreehandNX is a modern design tool inspired by the spirit of Freehand."
    />
    <meta property="og:image" content="https://freehandnx.com/assets/Share.png" />
    <meta property="og:image:alt" content="FreehandNX share preview" />
    <meta property="og:url" content="https://freehandnx.com/adminlogin" />
    <link rel="canonical" href="https://freehandnx.com/adminlogin" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FreehandNX – Modern Layout Design Tool for Posters & Magazines" />
    <meta
      name="twitter:description"
      content="Design posters, photobooks, and magazines with complete layout control. FreehandNX is a modern design tool inspired by the spirit of Freehand."
    />
    <meta name="twitter:image" content="https://freehandnx.com/assets/Share.png" />
    <title>Admin Login - FreehandNX</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        background: #050505;
        color: #f2f2f2;
      }

      .admin-login-shell {
        width: 100vw;
        height: 100vh;
        display: grid;
        grid-template-columns: 1fr 1fr;
        overflow: hidden;
      }

      .admin-login-media {
        background: #0e0e0e url("/assets/hero-background.png") center center / cover no-repeat;
      }

      .admin-login-panel {
        position: relative;
        background: #090909;
        display: grid;
        align-content: center;
        justify-items: start;
        gap: 18px;
        padding: 56px 64px 44px;
      }

      .admin-login-logo {
        display: block;
        width: 280px;
        max-width: 100%;
        height: auto;
        margin-bottom: 20px;
      }

      .admin-login-form {
        width: min(420px, 100%);
        display: grid;
        gap: 12px;
      }

      .admin-login-form label {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.86);
      }

      .admin-login-form input {
        width: 100%;
        height: 42px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.03);
        color: #fff;
        padding: 0 12px;
        font: inherit;
      }

      .admin-login-submit {
        margin-top: 8px;
        height: 42px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        background: transparent;
        color: rgba(255, 255, 255, 0.94);
        font: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }

      .admin-login-submit:disabled {
        opacity: 0.58;
        cursor: default;
      }

      .admin-login-status {
        margin: 4px 0 0;
        min-height: 20px;
        font-size: 0.92rem;
        color: rgba(255, 255, 255, 0.76);
      }

      @media (max-width: 960px) {
        .admin-login-shell {
          grid-template-columns: 1fr;
        }

        .admin-login-media {
          min-height: 280px;
        }

        .admin-login-panel {
          padding: 28px 24px 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="admin-login-shell" aria-label="Admin login">
      <section class="admin-login-media" aria-hidden="true"></section>
      <section class="admin-login-panel">
        <img src="/Logo/FreehandNX-White.svg" alt="FreehandNX" class="admin-login-logo" />
        <form id="adminLoginForm" class="admin-login-form" autocomplete="off">
          <label for="adminEmail">Email</label>
          <input id="adminEmail" name="email" type="email" required />

          <label for="adminPassword">Password</label>
          <input id="adminPassword" name="password" type="password" required />

          <button id="adminLoginSubmit" class="admin-login-submit" type="submit">Sign In</button>
          <p id="adminLoginStatus" class="admin-login-status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script>
      (() => {
        const form = document.getElementById("adminLoginForm");
        const statusEl = document.getElementById("adminLoginStatus");
        const submitBtn = document.getElementById("adminLoginSubmit");
        if (!form || !statusEl || !submitBtn) return;

        fetch("/api/admin/session", { method: "GET" })
          .then((response) => {
            if (response.ok) window.location.replace("/admin");
          })
          .catch(() => {});

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const email = String(document.getElementById("adminEmail")?.value || "").trim();
          const password = String(document.getElementById("adminPassword")?.value || "");
          if (!email || !password) {
            statusEl.textContent = "Email and password are required.";
            return;
          }
          submitBtn.disabled = true;
          statusEl.textContent = "Signing in...";
          try {
            const response = await fetch("/api/admin/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
              statusEl.textContent = payload?.error || "Login failed.";
              return;
            }
            window.location.replace("/admin");
          } catch {
            statusEl.textContent = "Network error. Please try again.";
          } finally {
            submitBtn.disabled = false;
          }
        });
      })();
    </script>
  </body>
</html>
